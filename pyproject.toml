[project]
name = "oscar-oauth1-tool"
version = "0.1.0"
description = "Standalone OAuth 1.0a (RFC 5849) client for Oscar EMR legacy web services"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oscar-oauth1 = "oscar_oauth1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscar_oauth1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
